# ================================================================
# CometaX - Docker Compose local
# ================================================================
# Uso:
#   docker compose up --build        -> construir e iniciar todo
#   docker compose up -d --build     -> en segundo plano
#   docker compose logs -f backend   -> ver logs del backend
#   docker compose down -v           -> parar y borrar volumenes
# ================================================================

services:
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: cometax-backend
    restart: unless-stopped
    ports:
      - "8001:8000"
    environment:
      APP_NAME: CometaX
      APP_ENV: local
      APP_DEBUG: "true"
      APP_URL: http://localhost:8000
      APP_KEY: ${APP_KEY:-}
      APP_MAINTENANCE: "false"
      PAYMENTS_MAINTENANCE: "true"
      DB_CONNECTION: sqlite
      DB_DATABASE: /var/www/html/database/database.sqlite
      SESSION_DRIVER: database
      CACHE_STORE: database
      QUEUE_CONNECTION: database
      LOG_CHANNEL: stack
      LOG_LEVEL: debug
      STRIPE_KEY: ${STRIPE_KEY:-}
      STRIPE_SECRET: ${STRIPE_SECRET:-}
      CASHIER_CURRENCY: mxn
    volumes:
      - backend_sqlite:/var/www/html/database
      - backend_storage:/var/www/html/storage
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/up"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 30s

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
      args:
        VITE_API_URL: http://localhost:8001
    container_name: cometax-frontend
    restart: unless-stopped
    ports:
      - "5174:5173"
    depends_on:
      backend:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:5173"]
      interval: 15s
      timeout: 5s
      retries: 3

volumes:
  backend_sqlite:
    name: cometax_sqlite
  backend_storage:
    name: cometax_storage
